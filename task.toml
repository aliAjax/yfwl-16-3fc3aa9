user = "worker"

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
workdir = "/app"

[verifier]
timeout_sec = 120
user = "worker"

[metadata]
difficulty = "expert"
category = "simulation"
tags = ["queueing-network", "routing-recovery", "least-squares", "deterministic-simulation"]
expert_time_estimate = "75m"
